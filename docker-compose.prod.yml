services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantes
      POSTGRES_USER: plantes
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantes"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/bxota/plants-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      default:
      caddy_net:
        aliases:
          - plantes_backend

  frontend:
    image: ghcr.io/bxota/plants-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports: []
    networks:
      default:
      caddy_net:
        aliases:
          - plants_frontend

networks:
  caddy_net:
    external: true

volumes:
  pgdata:
  uploads:
